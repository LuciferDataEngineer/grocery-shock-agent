name: ci

on:
  pull_request:
  push:
    branches: [main, feat/grocery-shock-agent]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Lint and test
        run: make ci
        env:
          GX_ANALYTICS_ENABLED: "false"
          TQDM_DISABLE: "1"
